name: Group CD

on:
  workflow_call:
    inputs:
      cicd:
        description: CI/CD project group
        required: true
        type: string
      package_version:
        description: NuGet package version
        required: true
        type: string
      source_ref:
        description: Git ref containing the release source
        required: true
        type: string
    secrets:
      NUGET_USER:
        description: NuGet.org profile name used by Trusted Publishing
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_CONFIGURATION: Release
  PACKAGE_OUTPUT_DIR: ./artifacts/packages
  PACKAGE_MANIFEST_PATH: ./artifacts/packages/package-manifest.json
  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages

jobs:
  discover:
    name: Validate and discover ${{ inputs.cicd }} release
    runs-on: ubuntu-latest
    outputs:
      source_operating_systems: ${{ steps.plan.outputs.source_operating_systems }}
      package_operating_systems: ${{ steps.plan.outputs.package_operating_systems }}
      has_source_stage: ${{ steps.plan.outputs.has_source_stage }}
      has_package_stage: ${{ steps.plan.outputs.has_package_stage }}

    steps:
      - name: Validate release inputs
        shell: pwsh
        env:
          CICD_GROUP: ${{ inputs.cicd }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ($env:CICD_GROUP -cnotmatch '^(default|[a-z0-9-]+)$') {
            throw "Invalid CICD group '$env:CICD_GROUP'."
          }
          $numericIdentifier = '(?:0|[1-9][0-9]*)'
          $prereleaseIdentifier = '(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          $versionPattern = "$numericIdentifier\.$numericIdentifier\.$numericIdentifier(?:-$prereleaseIdentifier(?:\.$prereleaseIdentifier)*)?"
          if ($env:PACKAGE_VERSION -cnotmatch "^$versionPattern$") {
            throw "Invalid package version '$env:PACKAGE_VERSION'."
          }
          $tag = if ($env:CICD_GROUP -eq 'default') { "v$env:PACKAGE_VERSION" } else { "$env:CICD_GROUP-v$env:PACKAGE_VERSION" }
          $expectedRef = "refs/tags/$tag"
          if ($env:SOURCE_REF -cne $expectedRef) {
            throw "Release source '$env:SOURCE_REF' does not match '$expectedRef'."
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Discover projects and test plan
        id: plan
        shell: pwsh
        env:
          CICD_GROUP: ${{ inputs.cicd }}
        run: |
          $projectsFile = Join-Path $env:RUNNER_TEMP 'cicd-projects.json'
          ./eng/workflows/Get-Projects.ps1 -CICD $env:CICD_GROUP -Json -OutputPath $projectsFile
          $group = (Get-Content -LiteralPath $projectsFile -Raw | ConvertFrom-Json).groups[0]
          $hasSourceStage = @($group.sourceOperatingSystems).Count -gt 0
          $hasPackageStage = @($group.packageOperatingSystems).Count -gt 0
          $sourceMatrix = @(if ($hasSourceStage) { $group.sourceOperatingSystems } else { 'linux' })
          $packageMatrix = @(if ($hasPackageStage) { $group.packageOperatingSystems } else { 'linux' })
          $sourceOperatingSystems = ConvertTo-Json -InputObject $sourceMatrix -Compress
          $packageOperatingSystems = ConvertTo-Json -InputObject $packageMatrix -Compress
          "source_operating_systems=$sourceOperatingSystems" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_operating_systems=$packageOperatingSystems" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "has_source_stage=$hasSourceStage".ToLowerInvariant() | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "has_package_stage=$hasPackageStage".ToLowerInvariant() | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  source-test:
    name: Source tests (${{ matrix.operating_system }})
    needs: discover
    if: needs.discover.outputs.has_source_stage == 'true'
    strategy:
      fail-fast: false
      matrix:
        operating_system: ${{ fromJSON(needs.discover.outputs.source_operating_systems) }}
    runs-on: ${{ matrix.operating_system == 'windows' && 'windows-latest' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Discover projects
        shell: pwsh
        env:
          CICD_GROUP: ${{ inputs.cicd }}
        run: |
          ./eng/workflows/Get-Projects.ps1 `
            -CICD $env:CICD_GROUP `
            -Json `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'cicd-projects.json')

      - name: Build and run source-stage tests
        shell: pwsh
        env:
          OPERATING_SYSTEM: ${{ matrix.operating_system }}
        run: |
          ./eng/workflows/Invoke-SourceTests.ps1 `
            -OperatingSystem $env:OPERATING_SYSTEM `
            -ProjectsJson (Join-Path $env:RUNNER_TEMP 'cicd-projects.json')

  pack:
    name: Pack ${{ inputs.cicd }} release candidate
    needs: [discover, source-test]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      (needs.source-test.result == 'success' || needs.source-test.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Discover projects
        shell: pwsh
        env:
          CICD_GROUP: ${{ inputs.cicd }}
        run: |
          ./eng/workflows/Get-Projects.ps1 `
            -CICD $env:CICD_GROUP `
            -Json `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'cicd-projects.json')

      - name: Resolve version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $versionParts = $env:PACKAGE_VERSION -split '-', 2
          "VERSION_PREFIX=$($versionParts[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $suffix = if ($versionParts.Count -eq 2) { $versionParts[1] } else { '' }
          "VERSION_SUFFIX=$suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore and build projects
        shell: pwsh
        run: |
          $group = (Get-Content (Join-Path $env:RUNNER_TEMP 'cicd-projects.json') -Raw | ConvertFrom-Json).groups[0]
          foreach ($project in $group.projects) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { throw "Restore failed for '$project'." }
            dotnet build $project --configuration $env:BUILD_CONFIGURATION --no-restore -p:VersionPrefix=$env:VERSION_PREFIX -p:VersionSuffix=$env:VERSION_SUFFIX -p:GeneratePackageOnBuild=false
            if ($LASTEXITCODE -ne 0) { throw "Build failed for '$project'." }
          }

      - name: Pack projects and create manifest
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $group = (Get-Content (Join-Path $env:RUNNER_TEMP 'cicd-projects.json') -Raw | ConvertFrom-Json).groups[0]
          New-Item -ItemType Directory -Path $env:PACKAGE_OUTPUT_DIR -Force | Out-Null
          foreach ($project in $group.packableProjects) {
            dotnet pack $project --configuration $env:BUILD_CONFIGURATION --no-build --output $env:PACKAGE_OUTPUT_DIR -p:PackageVersion=$env:PACKAGE_VERSION -p:VersionPrefix=$env:VERSION_PREFIX -p:VersionSuffix=$env:VERSION_SUFFIX -p:GeneratePackageOnBuild=false
            if ($LASTEXITCODE -ne 0) { throw "Pack failed for '$project'." }
          }
          ./eng/workflows/New-PackageManifest.ps1 `
            -ProjectsJson (Join-Path $env:RUNNER_TEMP 'cicd-projects.json') `
            -PackageOutputDir $env:PACKAGE_OUTPUT_DIR `
            -PackageVersion $env:PACKAGE_VERSION `
            -OutputPath $env:PACKAGE_MANIFEST_PATH

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.cicd }}-${{ inputs.package_version }}
          path: |
            ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT_DIR }}/*.snupkg
            ${{ env.PACKAGE_MANIFEST_PATH }}
          if-no-files-found: error

  package-test:
    name: Release package tests (${{ matrix.operating_system }})
    needs: [discover, pack]
    if: needs.pack.result == 'success' && needs.discover.outputs.has_package_stage == 'true'
    strategy:
      fail-fast: false
      matrix:
        operating_system: ${{ fromJSON(needs.discover.outputs.package_operating_systems) }}
    runs-on: ${{ matrix.operating_system == 'windows' && 'windows-latest' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Discover projects
        shell: pwsh
        env:
          CICD_GROUP: ${{ inputs.cicd }}
        run: |
          ./eng/workflows/Get-Projects.ps1 `
            -CICD $env:CICD_GROUP `
            -Json `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'cicd-projects.json')

      - name: Download release candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.cicd }}-${{ inputs.package_version }}
          path: ${{ env.PACKAGE_OUTPUT_DIR }}

      - name: Verify release candidate manifest
        shell: pwsh
        env:
          CICD_GROUP: ${{ inputs.cicd }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          ./eng/workflows/Test-PackageManifest.ps1 `
            -PackageOutputDir $env:PACKAGE_OUTPUT_DIR `
            -ManifestPath $env:PACKAGE_MANIFEST_PATH `
            -ExpectedCICD $env:CICD_GROUP `
            -ExpectedPackageVersion $env:PACKAGE_VERSION

      - name: Run package-stage tests
        shell: pwsh
        env:
          CICD_GROUP: ${{ inputs.cicd }}
          OPERATING_SYSTEM: ${{ matrix.operating_system }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $hook = Join-Path 'eng/workflows/hooks' "$env:CICD_GROUP-package.ps1"
          if (-not (Test-Path -LiteralPath $hook -PathType Leaf)) {
            throw "Group '$env:CICD_GROUP' declares package-stage tests but has no package hook '$hook'."
          }
          & $hook `
            -OperatingSystem $env:OPERATING_SYSTEM `
            -ProjectsJson (Join-Path $env:RUNNER_TEMP 'cicd-projects.json') `
            -PackageOutputDir $env:PACKAGE_OUTPUT_DIR `
            -PackageVersion $env:PACKAGE_VERSION

  publish:
    name: Publish ${{ inputs.cicd }} to NuGet.org
    needs: [discover, pack, package-test]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.pack.result == 'success' &&
      (needs.package-test.result == 'success' || needs.package-test.result == 'skipped')
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Download verified release candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.cicd }}-${{ inputs.package_version }}
          path: ${{ env.PACKAGE_OUTPUT_DIR }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify release candidate manifest
        shell: pwsh
        env:
          CICD_GROUP: ${{ inputs.cicd }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          ./eng/workflows/Test-PackageManifest.ps1 `
            -PackageOutputDir $env:PACKAGE_OUTPUT_DIR `
            -ManifestPath $env:PACKAGE_MANIFEST_PATH `
            -ExpectedCICD $env:CICD_GROUP `
            -ExpectedPackageVersion $env:PACKAGE_VERSION

      - name: Login to NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish exact manifest packages to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $manifest = Get-Content -LiteralPath $env:PACKAGE_MANIFEST_PATH -Raw | ConvertFrom-Json
          foreach ($entry in @($manifest.files | Where-Object kind -CEQ 'main' | Sort-Object name)) {
            $packagePath = Join-Path $env:PACKAGE_OUTPUT_DIR $entry.name
            dotnet nuget push $packagePath --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw "Publishing '$($entry.name)' failed." }
          }
